services:
  service-b:
    image: ghcr.io/${GITHUB_OWNER}/mini-erp-service-b:latest
    restart: unless-stopped
    ports:
    - "8080:8080"
    environment:
      Email__Host: ${SMTP_HOST}
      Email__Port: ${SMTP_PORT}
      Email__Username: ${SMTP_USER}
      Email__Password: ${SMTP_PASSWORD}
      Email__From: ${SMTP_FROM}
      ConnectionStrings__DefaultConnection: "Host=postgres-b;Port=5432;Database=MiniErpDb;Username=postgres;Password=${POSTGRES_B_PASSWORD}"
      # Servis A token'i uretir, Servis B dogrular; ayni secret olmadan dogrulama calismaz.
      Jwt__Secret: ${JWT_SECRET}
      Jwt__Issuer: ${JWT_ISSUER:-MiniErp.ServiceA}
      Jwt__Audience: ${JWT_AUDIENCE:-MiniErp.ServiceB}
    volumes:
      - invoice_pdf_data:/app/data/invoices
    depends_on:
      - postgres-b

  postgres-b:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: MiniErpDb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_B_PASSWORD}
    volumes:
      - postgres_b_data:/var/lib/postgresql

  service-a:
    build: ./service-a
    image: ghcr.io/${GITHUB_OWNER}/mini-erp-service-a:latest
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: "postgresql://erp:${POSTGRES_A_PASSWORD}@postgres-a:5432/service_a_db"
      # JWT sozlesmesi: bu uc deger iki serviste de AYNI olmak zorunda. 
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER:-MiniErp.ServiceA}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-MiniErp.ServiceB}
      CORS_ORIGINS: ${CORS_ORIGINS}
      RESEND_API_KEY: ${RESEND_API_KEY}
      RESEND_FROM: ${RESEND_FROM}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM}

      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.6-flash}
      SERVICE_B_URL: ${SERVICE_B_URL:-http://service-b:8080}
    depends_on:
      - postgres-a
    volumes:
      - ./service-a:/app

  postgres-a:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: erp
      POSTGRES_PASSWORD: ${POSTGRES_A_PASSWORD}
      POSTGRES_DB: service_a_db
    volumes:
      - postgres_a_data:/var/lib/postgresql/data

volumes:
  postgres_b_data:
  postgres_a_data:
  invoice_pdf_data: